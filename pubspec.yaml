
name: taskbuddy
description: "TaskBuddy - Personal Task Management Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0

  # Google Authentication
  google_sign_in: ^7.2.0

  # Local Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Local Storage
  shared_preferences: ^2.5.3

  # Notifications
  flutter_local_notifications: ^19.5.0

  # Date & Time
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets will be configured when needed.
  # assets:
  #   - assets/images/
  #   - assets/icons/
